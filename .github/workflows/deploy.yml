name: Deploy CyberPulse

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Pull latest code
        run: cd /home/student/cyberpulse && git pull origin main

      - name: Build and start containers
        run: |
          cd /home/student/cyberpulse
          docker compose -f docker-compose.netlab.yml up -d --build

      - name: Show container logs on failure
        if: always()
        run: |
          cd /home/student/cyberpulse
          echo "=== Container status ==="
          docker compose -f docker-compose.netlab.yml ps -a
          echo "=== cyberpulse-web logs ==="
          docker logs cyberpulse-cyberpulse-web-1 --tail=40 2>&1 || true
          echo "=== backend logs ==="
          docker logs cyberpulse-backend-1 --tail=40 2>&1 || true

      - name: Run database migrations
        run: |
          cd /home/student/cyberpulse
          docker compose -f docker-compose.netlab.yml exec -T -e PYTHONPATH=/app backend alembic upgrade head

      - name: Health check
        run: |
          for i in $(seq 1 30); do
            STATUS=$(docker exec cyberpulse-backend-1 curl -sf http://localhost:8000/api/health 2>/dev/null && echo "ok" || echo "fail")
            if [ "$STATUS" = "ok" ]; then
              echo "Backend healthy on attempt $i"
              exit 0
            fi
            # Show backend logs on first 3 failures to diagnose
            if [ "$i" -le 3 ]; then
              echo "--- backend logs (attempt $i) ---"
              docker logs cyberpulse-backend-1 --tail=20 2>&1 || true
            fi
            echo "Attempt $i/30 failed, retrying in 2s..."
            sleep 2
          done
          echo "Backend did not become healthy after 60s"
          echo "--- final backend logs ---"
          docker logs cyberpulse-backend-1 --tail=50 2>&1 || true
          exit 1

      - name: Confirm deployment
        run: echo "Deploy successful"

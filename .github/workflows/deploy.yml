name: Deploy CyberPulse

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Pull latest code
        run: cd /home/student/cyberpulse && git pull origin main

      - name: Rebuild changed containers (no cache)
        run: |
          cd /home/student/cyberpulse
          docker compose -f docker-compose.netlab.yml build --no-cache frontend backend worker beat

      - name: Start / recreate containers
        run: |
          cd /home/student/cyberpulse
          docker compose -f docker-compose.netlab.yml up -d

      - name: Run database migrations
        run: |
          cd /home/student/cyberpulse
          sleep 5
          docker compose -f docker-compose.netlab.yml exec -T -e PYTHONPATH=/app backend alembic upgrade head

      - name: Health check
        run: |
          for i in $(seq 1 30); do
            if docker exec cyberpulse-backend-1 curl -sfo /dev/null http://localhost:8000/api/health 2>/dev/null; then
              echo "Backend healthy on attempt $i"
              exit 0
            fi
            echo "Attempt $i/30 failed, retrying in 2s..."
            sleep 2
          done
          echo "Backend did not become healthy after 60s"
          docker logs cyberpulse-backend-1 --tail=30 2>&1 || true
          exit 1

      - name: Show container status
        if: always()
        run: |
          cd /home/student/cyberpulse
          echo "=== Container status ==="
          docker compose -f docker-compose.netlab.yml ps -a
          echo "=== backend logs (last 40) ==="
          docker logs cyberpulse-backend-1 --tail=40 2>&1 || true

      - name: Confirm deployment
        run: echo "Deploy successful"

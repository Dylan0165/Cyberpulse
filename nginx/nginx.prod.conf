events { worker_connections 1024; }

http {
  upstream frontend { server frontend:3000; }
  upstream backend  { server backend:8000; }
  upstream marketing { server marketing:3100; }

  # HTTP → HTTPS redirect
  server {
    listen 80;
    server_name scanix.nl www.scanix.nl app.scanix.nl;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
  }

  # scanix.nl — marketing site
  server {
    listen 443 ssl http2;
    server_name scanix.nl www.scanix.nl;
    ssl_certificate     /etc/letsencrypt/live/scanix.nl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scanix.nl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    location / { proxy_pass http://marketing; proxy_set_header Host $host; }
  }

  # app.scanix.nl — dashboard + API
  server {
    listen 443 ssl http2;
    server_name app.scanix.nl;
    ssl_certificate     /etc/letsencrypt/live/app.scanix.nl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.scanix.nl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;

    client_max_body_size 10M;

    # WebSocket
    location /ws/ {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_read_timeout 3600s;
    }

    # API
    location /api/ {
      proxy_pass http://backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 120s;
    }

    # Agent bestanden
    location /agent/ {
      proxy_pass http://backend;
      proxy_set_header Host $host;
    }

    # Frontend
    location / {
      proxy_pass http://frontend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}

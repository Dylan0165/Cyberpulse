services:
  # ── PostgreSQL ───────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autopentest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-autopentest}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-autopentest}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis ────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── CyberPulse Standalone Engine ─────────────────────────
  cyberpulse-web:
    build:
      context: ./cyberpulse
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    ports:
      - "7823:7823"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - scan_data:/app/data/scans
    environment:
      CYBERPULSE_HOST: "0.0.0.0"
      CYBERPULSE_PORT: "7823"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7823/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  # ── FastAPI Backend ──────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      cyberpulse-web:
        condition: service_started
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - secure_reports:/opt/scanix/reports
    environment:
      # Multi-AI provider keys (loaded from .env; listed here for clarity).
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      DEEPSEEK_BASE_URL: "${DEEPSEEK_BASE_URL:-https://api.deepseek.com}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      RUNPOD_API_KEY: "${RUNPOD_API_KEY:-}"
      RUNPOD_ENDPOINT_URL: "${RUNPOD_ENDPOINT_URL:-}"
      RUNPOD_MODEL_NAME: "${RUNPOD_MODEL_NAME:-mistral-7b-instruct}"
      # netlab/demo runs over HTTP → keep cookies SameSite=Lax. Set to
      # "production" only on the real HTTPS server (enables SameSite=None;Secure
      # + .scanix.nl cookie domain for cross-subdomain login).
      ENVIRONMENT: "${ENVIRONMENT:-development}"
      # Extra CORS origins (comma-separated) without a code change.
      EXTRA_CORS_ORIGINS: "${EXTRA_CORS_ORIGINS:-}"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  # ── Celery Worker ────────────────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - secure_reports:/opt/scanix/reports
    environment:
      # Multi-AI provider keys — the worker runs the actual AI analysis.
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      DEEPSEEK_BASE_URL: "${DEEPSEEK_BASE_URL:-https://api.deepseek.com}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      RUNPOD_API_KEY: "${RUNPOD_API_KEY:-}"
      RUNPOD_ENDPOINT_URL: "${RUNPOD_ENDPOINT_URL:-}"
      RUNPOD_MODEL_NAME: "${RUNPOD_MODEL_NAME:-mistral-7b-instruct}"
      ENVIRONMENT: "${ENVIRONMENT:-development}"
      EXTRA_CORS_ORIGINS: "${EXTRA_CORS_ORIGINS:-}"
    command: celery -A app.workers.celery_app worker -l info -c 2 -Q scans,analysis

  # ── Celery Beat (scheduler) ──────────────────────────────
  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app beat -l info --scheduler celery.beat:PersistentScheduler

  # ── Next.js Frontend ─────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      BACKEND_URL: "http://backend:8000"

  # ── Scanix Marketing Website (scanix.nl) ─────────────────
  scanix-website:
    build:
      context: ./scanix-website
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      # Direct access at http://<server>:3100 (handy before DNS is set up).
      - "3100:3000"
    environment:
      NODE_ENV: "production"
      # Optional: set to an email API / webhook to forward contact-form leads.
      CONTACT_WEBHOOK_URL: "${CONTACT_WEBHOOK_URL:-}"

  # ── Nginx Reverse Proxy ──────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
      - scanix-website

volumes:
  pgdata:
  redisdata:
  scan_data:
  secure_reports:

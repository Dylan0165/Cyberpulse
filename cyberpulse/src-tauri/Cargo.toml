[package]
name = "cyberpulse"
version = "0.1.0"
description = "CyberPulse — Automated Penetration Testing Platform"
authors = ["CyberPulse"]
license = ""
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.6", features = ["shell-sidecar", "shell-execute", "path-all", "fs-all", "dialog-open", "dialog-save"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
